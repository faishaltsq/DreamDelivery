<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dream Delivery art comparison</title><style>body{margin:24px;background:#141d38;color:#fff5e8;font:16px system-ui}h1,h2{font-family:Georgia,serif}img{display:block;max-width:100%;height:auto}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin:24px 0}figure{margin:0}figcaption{padding:8px 0}header img{max-width:1000px}@media(max-width:700px){section{grid-template-columns:1fr}}</style><header><h1>Approved master reference</h1><img src="../DreamDelivery_AssetPack_Prototype_v1/DreamDelivery_ArtPack_v0.1/references/master-original.png" alt="Approved Dream Delivery concept"><p>V1 remains the default. V2 is an opt-in integration candidate: upscaled previews and pose-reuse animation, not native HD production art.</p></header><main id="comparisons"></main><script>const screens=['post-office','write-letter','courier-selection','route-selection','journey','encounter','story-postcard','stamp-album'];const root=document.getElementById('comparisons');for(const width of [390,768,1440,1920])for(const screen of screens){const h=document.createElement('h2');h.textContent=width+'px / '+screen;root.append(h);const section=document.createElement('section');for(const [folder,label]of [['reconstruction','V1 refined layout'],['reconstruction-v2','V2 delivered preview']]){const figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');img.src=folder+'/'+width+'-'+screen+'.png';img.alt=label+' '+screen;caption.textContent=label;figure.append(img,caption);section.append(figure)}root.append(section)}</script></html>
